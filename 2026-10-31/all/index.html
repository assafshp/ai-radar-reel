function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function age(h) { return h < 1 ? Math.max(1, Math.round(h * 60)) + "m" : h < 48 ? Math.floor(h) + "h" : Math.floor(h / 24) + "d"; }
function views(n) { return n == null ? "" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M views" : n >= 1e3 ? Math.round(n / 1e3) + "K views" : n + " views"; }
function list() {
  var q = $("q").value.trim().toLowerCase();
  var out = ALL.filter(function (v) {
    return (topic === "All" || v.topic === topic) && (!picked || v.picked) && (shorts ? v.short : !v.short) &&
      (!q || (v.title + " " + v.channel).toLowerCase().indexOf(q) >= 0);
  });
  if ($("sort").value === "new") out.sort(function (a, b) { return a.age - b.age; });
  return out;
}
function render() {
  var out = list(), part = out.slice(0, shown);
  $("grid").innerHTML = part.map(function (v) {
    return '<button class="card" data-id="' + v.id + '"><div class="th"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/' + v.id +
      '/mqdefault.jpg">' + (v.picked ? '<span class="pick">Reel ' + v.picked + '</span>' : "") +
      (v.duration ? '<span class="dur">' + esc(v.duration) + '</span>' : "") + '<span class="play">▶</span></div>' +
      '<div class="tx"><b>' + esc(v.title) + '</b><span>' + esc(v.channel) + ' · ' + views(v.views) + ' · ' + age(v.age) + ' ago</span></div></button>';
  }).join("");
  $("shown").textContent = "Showing " + part.length + " of " + out.length;
  $("more").hidden = part.length >= out.length;
}
function chips() {
  var topics = {}; ALL.forEach(function (v) { if (v.topic) topics[v.topic] = (topics[v.topic] || 0) + 1; });
  var names = ["All"].concat(Object.keys(topics).sort(function (a, b) { return topics[b] - topics[a]; }));
  $("chips").innerHTML = '<button class="chip" data-pick="1">In reel</button><button class="chip' + (shorts ? " on" : "") + '" data-shorts="1">Shorts</button>' + names.map(function (t) {
    return '<button class="chip' + (t === topic ? " on" : "") + '" data-t="' + esc(t) + '">' + esc(t) + (t === "All" ? "" : " " + topics[t]) + '</button>';
  }).join("");
  var p = $("chips").querySelector("[data-pick]"); if (picked) p.classList.add("on");
}
function open(id) {
  var v = ALL.find(function (x) { return x.id === id; });
  var link = "https://youtu.be/" + id + (v.start ? "?t=" + v.start : "");
  if (!v.embed) { window.open(link, "_blank", "noopener"); return; }
  $("stage").innerHTML = '<iframe allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen ' +
    'src="https://www.youtube.com/embed/' + id + '?autoplay=1&playsinline=1&rel=0&modestbranding=1' + (v.start ? "&start=" + v.start : "") + '"></iframe>';
  $("mt").textContent = v.title; $("mm").textContent = v.channel + " · " + views(v.views) + (v.start ? " · starts at the highlight" : "");
  $("app").href = link; $("modal").classList.add("on");
}
function close() { $("modal").classList.remove("on"); $("stage").innerHTML = ""; }   // removing the iframe stops playback
$("grid").onclick = function (e) { var c = e.target.closest(".card"); if (c) open(c.dataset.id); };
$("chips").onclick = function (e) {
  var b = e.target.closest(".chip"); if (!b) return;
  if (b.dataset.pick) picked = !picked; else if (b.dataset.shorts) shorts = !shorts; else topic = b.dataset.t;
  shown = PAGE; chips(); render();
};
$("q").oninput = function () { shown = PAGE; render(); };
$("sort").onchange = function () { shown = PAGE; render(); };
$("more").onclick = function () { shown += PAGE; render(); };
$("close").onclick = close;
$("modal").onclick = function (e) { if (e.target === $("modal")) close(); };
document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
$("count").textContent = ALL.filter(function (v) { return !v.short; }).length + " videos · Shorts hidden (tap Shorts)";
chips(); render();
</script>
</body></html>
